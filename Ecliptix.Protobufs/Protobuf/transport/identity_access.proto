syntax = "proto3";

package ecliptix.transport.identity;
option csharp_namespace = "Ecliptix.Protobuf.Transport.Identity";

enum IdentityAccessEventType {
  IDENTITY_ACCESS_EVENT_TYPE_UNSPECIFIED = 0;
  IDENTITY_ACCESS_REGISTRATION_INIT = 1;
  IDENTITY_ACCESS_REGISTRATION_COMPLETE = 2;
  IDENTITY_ACCESS_RECOVERY_INIT = 3;
  IDENTITY_ACCESS_RECOVERY_COMPLETE = 4;
  IDENTITY_ACCESS_SIGN_IN_INIT = 5;
  IDENTITY_ACCESS_SIGN_IN_COMPLETE = 6;
  IDENTITY_ACCESS_LOGOUT = 7;
  IDENTITY_ACCESS_LOGOUT_ANONYMOUS = 8;
  IDENTITY_ACCESS_VERIFY_OTP = 9;
  IDENTITY_ACCESS_VALIDATE_MOBILE_NUMBER = 10;
  IDENTITY_ACCESS_CHECK_MOBILE_AVAILABILITY = 11;
  IDENTITY_ACCESS_RECOVERY_MOBILE_VERIFICATION = 12;
  IDENTITY_ACCESS_CHECK_PROFILE_NAME = 13;
  IDENTITY_ACCESS_UPSERT_PROFILE = 14;
  IDENTITY_ACCESS_GET_PROFILE = 15;
}

enum MembershipActivityStatus {
  MEMBERSHIP_ACTIVITY_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_ACTIVE = 1;
  MEMBERSHIP_INACTIVE = 2;
}

enum MembershipCreationStatus {
  MEMBERSHIP_CREATION_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_OTP_VERIFIED = 1;
  MEMBERSHIP_SECURE_KEY_SET = 2;
  MEMBERSHIP_PASSPHRASE_SET = 3;
}

message Account {
  bytes unique_identifier = 1;
}

message Membership {
  bytes unique_identifier = 1;
  MembershipActivityStatus status = 2;
  MembershipCreationStatus creation_status = 3;
  bytes account_unique_identifier = 4;
}

enum VerificationPurpose {
  VERIFICATION_PURPOSE_UNSPECIFIED = 0;
  REGISTRATION = 1;
  SECURE_KEY_RECOVERY = 2;
}

enum VerificationResult {
  VERIFICATION_RESULT_UNSPECIFIED = 0;
  SUCCEEDED = 1;
  INVALID_MOBILE = 2;
  FAILED = 3;
}

enum MobileAvailabilityStatus {
  MOBILE_AVAILABILITY_STATUS_UNSPECIFIED = 0;
  AVAILABLE = 1;
  REGISTRATION_EXPIRED = 2;
  INCOMPLETE_REGISTRATION = 3;
  DATA_CORRUPTION = 4;
  TAKEN_ACTIVE = 5;
  TAKEN_INACTIVE = 6;
}

message ValidateMobileNumberRequest {
  string mobile_number = 1;
}

message ValidateMobileNumberResponse {
  VerificationResult result = 1;
  string message = 2;
  bytes mobile_number_identifier = 3;
}

message CheckMobileNumberAvailabilityRequest {
  bytes mobile_number_id = 1;
}

message CheckMobileNumberAvailabilityResponse {
  MobileAvailabilityStatus status = 1;
  optional bytes existing_membership_id = 2;
  optional MembershipActivityStatus activity_status = 3;
  optional MembershipCreationStatus creation_status = 4;
  optional bytes account_unique_identifier = 5;
  optional string localization_key = 6;
}

enum VerificationRequestType {
  VERIFICATION_REQUEST_TYPE_UNSPECIFIED = 0;
  SEND_OTP = 1;
  RESEND_OTP = 2;
}

message InitiateVerificationRequest {
  bytes mobile_number_identifier = 1;
  VerificationPurpose purpose = 2;
  VerificationRequestType type = 3;
}

enum CountdownUpdateStatus {
  COUNTDOWN_UPDATE_STATUS_UNSPECIFIED = 0;
  COUNTDOWN_ACTIVE = 1;
  COUNTDOWN_EXPIRED = 2;
  COUNTDOWN_RESEND_COOLDOWN = 3;
  COUNTDOWN_FAILED = 4;
  COUNTDOWN_NOT_FOUND = 5;
  COUNTDOWN_MAX_ATTEMPTS_REACHED = 6;
  COUNTDOWN_SESSION_EXPIRED = 7;
  COUNTDOWN_SERVER_UNAVAILABLE = 8;
}

message VerificationCountdownUpdate {
  uint32 seconds_remaining = 1;
  bytes session_identifier = 2;
  CountdownUpdateStatus status = 3;
  optional string message = 4;
}

message VerifyCodeRequest {
  string code = 1;
  VerificationPurpose purpose = 2;
  uint32 stream_connect_id = 3;
}

message VerifyCodeResponse {
  VerificationResult result = 1;
  Membership membership = 2;
}

message OpaqueRegistrationInitRequest {
  bytes peer_oprf = 1;
  bytes membership_identifier = 2;
}

message OpaqueRegistrationInitResponse {
  enum UpdateResult {
    UPDATE_RESULT_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    INVALID_CREDENTIALS = 2;
  }

  UpdateResult result = 1;
  bytes peer_oprf = 2;
  string message = 3;
}

message OpaqueRegistrationCompleteRequest {
  bytes peer_registration_record = 1;
  bytes membership_identifier = 2;
}

message OpaqueRegistrationCompleteResponse {
  enum RegistrationResult {
    REGISTRATION_RESULT_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    FAILED = 2;
  }

  RegistrationResult result = 1;
  Account active_account = 2;
  Membership membership = 3;
}

message OpaqueSignInInitRequest {
  string mobile_number = 1;
  bytes peer_oprf = 2;
}

message OpaqueSignInInitResponse {
  enum SignInResult {
    SIGN_IN_RESULT_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    INVALID_CREDENTIALS = 2;
    LOGIN_ATTEMPT_EXCEEDED = 3;
  }

  SignInResult result = 1;
  bytes server_state_token = 2;
  string message = 3;
}

message OpaqueSignInFinalizeRequest {
  string mobile_number = 1;
  bytes client_mac = 2;
}

message OpaqueSignInFinalizeResponse {
  enum SignInResult {
    SIGN_IN_RESULT_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    INVALID_CREDENTIALS = 2;
  }

  SignInResult result = 1;
  string message = 2;
  Membership membership = 3;
  Account active_account = 4;
}

message OpaqueRecoverySecureKeyInitRequest {
  bytes membership_identifier = 1;
  bytes peer_oprf = 2;
}

message OpaqueRecoverySecureKeyInitResponse {
  enum RecoveryResult {
    RECOVERY_RESULT_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    INVALID_CREDENTIALS = 2;
  }

  RecoveryResult result = 1;
  bytes peer_oprf = 2;
  Membership membership = 3;
}

message OpaqueRecoverySecretKeyCompleteRequest {
  bytes membership_identifier = 1;
  bytes peer_recovery_record = 2;
}

message OpaqueRecoverySecretKeyCompleteResponse {
  enum RecoveryResult {
    RECOVERY_RESULT_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    FAILED = 2;
  }

  RecoveryResult result = 1;
}

enum LogoutScope {
  LOGOUT_SCOPE_UNSPECIFIED = 0;
  THIS_DEVICE = 1;
  ALL_DEVICES = 2;
}

message LogoutRequest {
  bytes membership_identifier = 1;
  string logout_reason = 2;
  int64 timestamp = 3;
  LogoutScope scope = 4;
  bytes hmac_proof = 5;
  bytes account_identifier = 6;
}

message AccountProfile {
  bytes account_id = 1;
  bytes profile_id = 2;
  string display_name = 3;
  string profile_name = 4;
}

message GetAccountProfileRequest {
  bytes current_account_id = 1;
  bytes by_account_id = 2;
}

message GetAccountProfileResponse {
  AccountProfile profile = 1;
}

message CreateOrUpdateProfileRequest {
  bytes account_id = 1;
  string profile_name = 2;
  string display_name = 3;
}

message CreateOrUpdateProfileResponse {
  bool is_success = 1;
}

message LogoutResponse {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    ALREADY_LOGGED_OUT = 2;
    SESSION_NOT_FOUND = 3;
    INVALID_TIMESTAMP = 4;
    INVALID_HMAC = 5;
    FAILED = 6;
  }

  Result result = 1;
  bytes revocation_proof = 2;
  int64 server_timestamp = 3;
}
